syntax = "proto3";

package sunxiaoning;  // 当转化为C++文件时，namespace hello{}。这有助于解决不同项目之间的命名冲突。

// 每个 message 都是一个数据结构，message 中的每个字段需要指定“字段类型”、“名称”
// 每个元素的“=1”“=2”表示该字段在二进制编码中使用的唯一“标识”
message Person {
  string name = 1;
  int32 id = 2;
  optional string email = 3;

  enum PhoneType {
    MOBILE = 0;
    HOME = 1;
    WORK = 2;
  }

  message PhoneNumber {
    string number = 1;
    optional PhoneType type = 2;
  }

  repeated PhoneNumber phones = 4;
}

message AddressBook {
  repeated Person people = 1;
}

// .proto 文件的编译器叫 protoc
// 执行 shell 命令后，将在指定的目标目录中生成以下文件：
// addressbook.pb.h： 类声明的头文件
// addressbook.pb.cc：类实现
// 获取指定字段的值的成员函数：    字段名称的小写形式()
// 往指定字段写入值的成员函数：    set_字段名称的小写形式()
// 将字段重新设置成 empty 状态：   clear_字段名称的小写形式()

// 获取一个指向该字段的指针： mutable_字段名称的小写形式()  额外得到一个 “set_字段名称的小写形式()”的成员函数。

// repeated 修饰的字段:
//      检查字段的长度
//      更新指定索引处的值
//      允许传入新值的成员函数： add_字段名称的小写形式()